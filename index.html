<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>チャート評価</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header>
    <div class="progress-row">
      <span id="kind-badge"></span>
      <span id="counter">- / -</span>
      <button id="download-btn" type="button">結果を保存</button>
    </div>
    <div class="progress-track"><div id="progress-bar"></div></div>
  </header>

  <main>
    <div id="chart-area"></div>
    <p id="hint">この形ですか？</p>
    <p id="kind-desc"></p>
  </main>

  <section id="reason-area">
    <input id="note-input" type="text" inputmode="text" autocomplete="off"
           placeholder="コメント（任意）">
  </section>

  <footer>
    <div class="button-row">
      <button class="label-btn other" data-label="no" type="button">
        <span class="mark">✕</span><span class="text">違う</span>
      </button>
      <button class="label-btn good" data-label="match" type="button">
        <span class="mark">◎</span><span class="text">この形だ</span>
      </button>
    </div>
    <div class="sub-row">
      <button id="back-btn" type="button">← 1つ戻る</button>
      <button id="clear-btn" type="button">このラベルを消す</button>
      <button id="clear-all-btn" class="danger" type="button">全消去</button>
    </div>
    <div class="status-row"><span id="status"></span></div>
  </footer>
</div>

<div id="done-screen" hidden>
  <h1>お疲れさまでした</h1>
  <p id="done-summary"></p>
  <button id="download-btn-2" type="button">結果をダウンロード</button>
  <button id="review-btn" type="button">最初から見直す</button>
  <button id="clear-all-btn-2" class="danger" type="button">全てのラベルを消去</button>
</div>

<script src="app.js"></script>
</body>
</html>
